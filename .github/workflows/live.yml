name: Refresh live traffic
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ADS-B hubs
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, os
          hubs = [
            ("EZE", -34.822, -58.536, 90),
            ("AEP", -34.559, -58.416, 45),
            ("GRU", -23.436, -46.473, 70),
            ("MIA", 25.796, -80.287, 70),
            ("MAD", 40.472, -3.563, 70),
            ("HND", 35.549, 139.78, 55),
            ("SIN", 1.364, 103.991, 70),
            ("RAI", 14.941, -23.485, 80),
            ("SID", 16.741, -22.949, 60),
            ("ASU", -25.24, -57.52, 70),
            ("SYD", -33.946, 151.177, 200),
            ("LHR", 51.47, -0.454, 70),
            ("JFK", 40.641, -73.778, 70),
            ("KIX", 34.427, 135.244, 70),
            ("NRT", 35.765, 140.386, 70),
            ("SCL", -33.393, -70.786, 70),
            ("DAC", 23.843, 90.398, 80),
          ]
          path = "docs/sky-cache.json"
          cache = {}
          if os.path.exists(path):
              try: cache = json.load(open(path))
              except Exception: cache = {}
          def pull(lat, lon, dist):
              urls = [
                  f"https://opendata.adsb.fi/api/v2/lat/{lat}/lon/{lon}/dist/{dist}",
                  f"https://api.adsb.lol/v2/lat/{lat}/lon/{lon}/dist/{dist}",
              ]
              last = None
              for url in urls:
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent":"pico-radar/1.0","Accept":"application/json"})
                      with urllib.request.urlopen(req, timeout=12) as r:
                          d = json.loads(r.read().decode())
                      lst = d.get("ac") or d.get("aircraft") or []
                      ac = []
                      for a in lst:
                          if a.get("lat") is None: continue
                          ac.append({
                              "hex": a.get("hex"),
                              "flight": (a.get("flight") or "").strip() or a.get("r") or a.get("hex"),
                              "r": a.get("r"), "t": a.get("t"),
                              "lat": a.get("lat"), "lon": a.get("lon"),
                              "alt": a.get("alt_baro") if a.get("alt_baro") is not None else a.get("alt"),
                              "gs": a.get("gs"), "track": a.get("track"), "dst": a.get("dst"),
                          })
                          if len(ac) >= 40: break
                      src = "adsb.fi" if "adsb.fi" in url else "adsb.lol"
                      return ac, src
                  except Exception as e:
                      last = e
                      continue
              raise last or RuntimeError("fail")
          for iata, lat, lon, dist in hubs:
              try:
                  ac, src = pull(lat, lon, dist)
                  cache[iata] = {"lat": lat, "lon": lon, "ts": time.time(), "src": src, "ac": ac}
                  print(iata, len(ac), src)
                  time.sleep(1.2)
              except Exception as e:
                  print(iata, "keep-old", e)
          json.dump(cache, open(path, "w"), separators=(",", ":"))
          eze = cache.get("EZE") or cache.get("AEP")
          if eze:
              json.dump({"ts": eze.get("ts"), "lat": eze["lat"], "lon": eze["lon"], "ac": eze["ac"]}, open("docs/live.json", "w"), separators=(",", ":"))
          print("wrote", len(cache), "hubs")
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar trafico ADS-B en vivo"
          file_pattern: docs/live.json docs/sky-cache.json
