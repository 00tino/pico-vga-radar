<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurar radar</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .wrap { max-width: 1120px; }
    .layout { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(280px, 1.1fr); gap: 22px; align-items: start; }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
    .monitor-frame { background: #111; border: 8px solid #2b2b2b; border-bottom-width: 22px; border-radius: 8px; }
    .monitor-frame iframe { display: block; width: 100%; aspect-ratio: 4/3; border: 0; background: #050508; }
    .caption { font-size: 12px; color: #9a958b; margin: 8px 0 0; }
    .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 13px; color: #ddd; }
    .checks label { color: #ddd; display: flex; gap: 8px; align-items: center; margin: 0; }
    .checks input { width: auto; margin: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav><a href="index.html">Inicio</a> <a href="sim.html?v=4">Simulador</a></nav>
    <p class="kicker">Setup</p>
    <h1>Configurar el radar</h1>
    <p class="hint">Vista previa a la derecha. Esta web puede ser pesada; al Pico le llega un JSON chico.</p>
    <div class="layout">
      <form id="f">
        <div class="card">
          <label>Wi-Fi de casa (solo 2.4 GHz)</label>
          <input name="ssid" placeholder="Nombre de la red" required>
          <input name="pass" type="password" placeholder="Clave" autocomplete="new-password">
        </div>
        <div class="card">
          <label>Aeropuerto (IATA)</label>
          <input name="airport" value="AEP" placeholder="AEP, LGA, DXB, JFK...">
          <label>O coordenadas de tu casa</label>
          <div class="row">
            <div><label>Lat</label><input name="lat" placeholder="-34.55"></div>
            <div><label>Lon</label><input name="lon" placeholder="-58.44"></div>
          </div>
          <label>Radio (km)</label>
          <input name="radius_km" type="number" value="80" min="5" max="400">
        </div>
        <div class="card">
          <label>Vista</label>
          <select name="mode">
            <option value="hybrid">Radar + lista</option>
            <option value="radar">Solo radar</option>
            <option value="wall">Solo lista</option>
          </select>
          <label>Formato de lista</label>
          <select name="list_style">
            <option value="fa">Tarjetas FlightAware</option>
            <option value="fids">Pantalla de aeropuerto</option>
            <option value="carousel">Un vuelo por vez</option>
          </select>
          <label>Rotar lista cada (s)</label>
          <input name="rotate_s" type="number" value="7" min="3" max="30">
          <label>Estilo radar</label>
          <select name="theme">
            <option value="crt_amber">CRT ambar</option>
            <option value="crt_green">CRT verde</option>
            <option value="atc_dark">ATC oscuro</option>
          </select>
        </div>
        <div class="card">
          <label>Que mostrar</label>
          <div class="checks">
            <label><input name="f_air" type="checkbox" checked> Aerolineas</label>
            <label><input name="f_ga" type="checkbox"> Gral. aviacion</label>
            <label><input name="f_biz" type="checkbox"> Jets ejecutivos</label>
            <label><input name="f_heli" type="checkbox"> Helicopteros</label>
          </div>
          <label>Seguir aerolinea</label>
          <input name="follow_airline" placeholder="JetSMART o JES">
          <label>Seguir vuelo</label>
          <input name="follow_flight" placeholder="JA3166">
          <label>Max. aviones</label>
          <input name="max_aircraft" type="number" value="16" min="1" max="24">
          <label><input name="include_ground" type="checkbox" style="width:auto;display:inline"> Incluir en tierra</label>
        </div>
        <button type="submit">Guardar</button>
        <p class="ok" id="msg" hidden>Guardado. En el Pico esto reinicia y aplica.</p>
      </form>
      <div>
        <div class="monitor-frame">
          <iframe id="prev" title="Vista previa" src="sim.html?embed=1&v=4"></iframe>
        </div>
        <p class="caption">Solo se muestran tarjetas enteras. La lista rota.</p>
      </div>
    </div>
  </div>
  <script>
    const f = document.getElementById('f');
    const frame = document.getElementById('prev');
    function cfg() {
      const data = Object.fromEntries(new FormData(f).entries());
      data.include_ground = f.include_ground.checked;
      data.f_air = f.f_air.checked;
      data.f_ga = f.f_ga.checked;
      data.f_biz = f.f_biz.checked;
      data.f_heli = f.f_heli.checked;
      data.max_aircraft = Number(data.max_aircraft);
      data.radius_km = Number(data.radius_km);
      data.rotate_s = Number(data.rotate_s);
      data.type = 'config';
      return data;
    }
    function push() { try { frame.contentWindow.postMessage(cfg(), '*'); } catch (e) {} }
    f.addEventListener('input', push);
    frame.addEventListener('load', () => setTimeout(push, 400));
    const saved = localStorage.getItem('picoRadarConfig');
    if (saved) {
      const c = JSON.parse(saved);
      Object.entries(c).forEach(([k,v]) => {
        if (!f[k]) return;
        if (f[k].type === 'checkbox') f[k].checked = !!v;
        else f[k].value = v;
      });
    }
    f.addEventListener('submit', e => {
      e.preventDefault();
      localStorage.setItem('picoRadarConfig', JSON.stringify(cfg()));
      document.getElementById('msg').hidden = false;
      push();
    });
  </script>
</body>
</html>
