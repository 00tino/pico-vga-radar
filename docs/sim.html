<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador</title>
<style>
:root{--amber:#e8b86d;--accent:#f2542d;--list:#e8b86d;--ink:#e8eef6;--bg:#050508;--card:#0b1018}
*{box-sizing:border-box}
body{margin:0;background:#14110e;color:#f4f1ea;font:15px/1.45 ui-sans-serif,system-ui,sans-serif}
header{padding:16px 20px 0;max-width:1240px;margin:0 auto}header a{color:var(--amber)}
.desk{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.86fr);gap:22px;max-width:1240px;margin:0 auto;padding:16px 20px 48px}
@media(max-width:920px){.desk{grid-template-columns:1fr}}
.monitor{background:#1a1a1a;border:10px solid #2c2c2c;border-bottom-width:28px;border-radius:10px}
.bezel{background:var(--bg);position:relative;overflow:hidden;font-family:ui-monospace,Menlo,monospace;height:min(62vh,720px);min-height:320px}
.scan{pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 2px,#0003 3px)}
canvas#radar{width:100%;height:100%;display:none}
.wall{display:none;position:absolute;right:10px;top:12px;bottom:12px;width:46%;overflow:hidden;flex-direction:column;justify-content:center;align-items:stretch;gap:6px}
.wall.full{left:10px;right:10px;width:auto}
#overCard{display:none;position:absolute;left:10px;bottom:12px;max-width:46%;z-index:3}
#load{display:none;position:absolute;inset:0;z-index:4;background:#0008;color:var(--list);align-items:center;justify-content:center;font:700 18px ui-monospace,monospace;letter-spacing:.12em}
#load.on{display:flex}
.sug{position:relative}
.sug-list{display:none;position:absolute;left:0;right:0;top:100%;z-index:8;background:#16161a;border:1px solid #444;border-radius:8px;max-height:220px;overflow:auto}
.sug-list button{display:block;width:100%;text-align:left;background:none;color:#eee;padding:8px 10px;margin:0;border-radius:0;font-weight:500;font-size:13px}
.sug-list button:hover{background:#2a2a30}
.logo{width:40px;height:40px;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 40px}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.logo .fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.fa-row{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:center}
.bar{flex:1;height:4px;background:#ffffff22;position:relative;overflow:hidden}.bar>i{position:absolute;inset:0 auto 0 0;background:var(--list)}
.fa-card{background:var(--card);border:1px solid var(--list);color:var(--ink);padding:7px 8px;border-radius:4px;flex:0 0 auto}
.carousel-wrap{height:100%;display:flex;align-items:stretch}
.carousel-wrap .fa-card{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px}
.carousel-wrap .logo{width:96px;height:96px;flex-basis:96px;margin:0 auto 12px}
.carousel-wrap .fa-row{grid-template-columns:1fr;text-align:center}
.carousel-wrap .fa-id{font-size:32px}.carousel-wrap .fa-route{font-size:26px}
.carousel-wrap .fa-met{font-size:20px;margin-top:18px}
.fa-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fa-id{font-weight:800;font-size:13px}
.fa-st{font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px}
.st-air{color:#7ee0a5;background:#0e2a1c}.st-gnd{color:#f0d27a;background:#2a220c}.st-late{color:#ff8b8b;background:#2a1212}
.fa-air{font-size:10px;color:#9aa8bd}
.fa-route{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px;font-weight:700}
.fa-times{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:10px;color:#c5d0de}.fa-times b{display:block;color:#fff;font-size:12px}
.lbl{color:#6f7f96;font-size:8px;letter-spacing:.08em;text-transform:uppercase}
.fa-met{margin-top:5px;color:var(--list);font-size:10px;font-weight:600}
.wall.full .fa-met{font-size:14px}
.fids{width:100%;border-collapse:collapse;font-size:11px;color:var(--list)}
.fids th{color:var(--list);font-size:8px;text-align:left;padding:3px 5px;border-bottom:1px solid var(--list)}
.fids td{padding:5px;border-bottom:1px solid #ffffff22;white-space:nowrap}
.phone{background:#0e0e10;border:8px solid #2a2a2e;border-radius:28px;padding:18px 14px 22px}
.notch{width:80px;height:8px;background:#222;border-radius:8px;margin:0 auto 12px}
label{display:block;font-size:11px;color:#9a958b;margin:8px 0 4px}
input,select{width:100%;padding:9px;border-radius:8px;border:1px solid #333;background:#16161a;color:#eee}
button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.ghost{background:#222;margin-top:8px}
.hint{font-size:12px;color:#9a958b}.wifi-banner{background:#1c1810;border:1px solid #e8b86d33;color:var(--amber);padding:8px 10px;border-radius:8px;font-size:12px;margin-bottom:10px}
#status{font-size:12px;color:#8fdf8a;margin-top:8px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:12px;color:#ddd}
.checks label{margin:0;display:flex;gap:6px;align-items:center;color:#ddd}.checks input{width:auto}
body.embed header,body.embed .phone{display:none}
body.embed .desk{display:block;margin:0;padding:0;max-width:none}
body.embed .monitor{border:0;border-radius:0}
body.embed .bezel{height:100vh;min-height:100vh}
</style></head>
<body>
<header><a href="index.html">← Proyecto</a><p class="hint">Abrí ?v=11</p></header>
<div class="desk">
<div class="monitor"><div class="bezel">
<canvas id="radar"></canvas>
<div id="overCard"></div>
<div class="wall" id="wall"></div>
<div class="scan"></div>
<div id="load">CARGANDO</div>
</div></div>
<div class="phone">
<div class="notch"></div>
<div class="wifi-banner">Preview · no guarda en el Pico</div>
<form id="f">
<label>Aeropuerto</label>
<div class="sug"><input id="preset" autocomplete="off" value="AEP" placeholder="Ezeiza, Cabo Verde, Osaka..."><div class="sug-list" id="sugAp"></div></div>
<button type="button" class="ghost" id="geo">Usar ubicacion del telefono</button>
<button type="button" class="ghost" id="demoHouse">Ver ejemplo de sobrevuelo</button>
<label>Radio (km)</label>
<input id="radius" type="number" value="80" min="10" max="250">
<label>Vista</label>
<select id="mode"><option value="hybrid">Radar + lista</option><option value="radar">Solo radar</option><option value="wall">Solo lista</option></select>
<label>Formato de lista</label>
<select id="listStyle"><option value="fa">FlightAware (tarjeta)</option><option value="fids">Pantalla de aeropuerto</option><option value="carousel">Un vuelo por vez</option></select>
<label>Rotar cada (s)</label>
<input id="rotate" type="number" value="7" min="3" max="30">
<label>Estilo radar</label>
<select id="theme"><option value="crt_amber">CRT ambar</option><option value="crt_green">CRT verde</option><option value="atc_dark">ATC oscuro</option><option value="navy">Azul marino</option><option value="red">Rojo ATC</option><option value="ice">Hielo</option></select>
<label>Que mostrar</label>
<div class="checks">
<label><input type="checkbox" id="fAir" checked> Aerolineas</label>
<label><input type="checkbox" id="fGa"> Gral. aviacion</label>
<label><input type="checkbox" id="fBiz"> Jets ejecutivos</label>
<label><input type="checkbox" id="fHeli"> Helicopteros</label>
</div>
<label>Seguir aerolinea</label>
<div class="sug"><input id="followAl" autocomplete="off" placeholder="Cape, Andes, ANA..."><div class="sug-list" id="sugAl"></div></div>
<div id="hubs" class="hint"></div>
<label>Seguir vuelo</label>
<input id="followFlt" placeholder="DL1390">
<label><input type="checkbox" id="house" style="width:auto"> Destacar sobre mi casa</label>
<label>Max. aviones</label>
<input id="max" type="number" value="16" min="4" max="24">
<label>Incluir en tierra</label>
<select id="ground"><option value="0">No</option><option value="1">Si</option></select>
<button>Aplicar en preview</button>
<p id="status"></p>
</form></div></div>
<script src="radar.js?v=11"></script>
</body></html>
